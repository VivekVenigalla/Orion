<title>Target-Driven Portfolio Matrix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. A flush top bar (level, XP, view toggle), a full-bleed canvas holding the
   skill tree as a star chart, and inset cards over it: the plan rail (left), the inspect panel (right). */
:root {
  color-scheme: dark;
  --bg: #060810;
  --surface: #0B0F1A;
  --raised: #121829;
  --line: #1C2338;
  --line-2: #2C3654;
  --ink: #E9EEFA;
  --muted: #93A0BF;
  --faint: #5F6B8A;
  --ice: #BED6FF;
  --cyan: #4FD6E8;
  --violet: #B092FF;
  --gold: #F6C453;
  --accent: #F6C453;
  --accent-soft: rgba(246, 196, 83, .12);
  --on-accent: #1A1203;
  --focus: #8FB8FF;
  --red: #FF8A8A;
  --display: 'Chakra Petch', 'Geist', system-ui, sans-serif;
  --sans: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .85, .2, 1);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { position: relative; height: 100%; overflow: hidden; overflow: clip; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }

.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.mono { font-family: var(--mono); }
.label { font-size: 12px; color: var(--muted); }
.cap { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
/* Panels share one frame: a hairline border with two gold corner marks, like a HUD window. */
.card { position: relative; background: linear-gradient(180deg, rgba(190, 214, 255, .04), rgba(190, 214, 255, 0) 140px), var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 18px 50px rgba(0, 0, 0, .6); }
.card::before, .card::after { content: ""; position: absolute; width: 13px; height: 13px; pointer-events: none; border: 1.5px solid var(--gold); opacity: .8; z-index: 2; }
.card::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 7px; }
.card::after { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 7px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raised); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
.btn:hover { border-color: #46527A; background: #172036; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 0 18px rgba(246, 196, 83, .22); }
.btn.primary:hover { background: #FFD772; border-color: #FFD772; box-shadow: 0 0 26px rgba(246, 196, 83, .4); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--raised); }
.btn.icon { width: 32px; padding: 0; }
.btn.tall { height: 40px; padding: 0 16px; font-size: 13.5px; }
.btn.danger:hover { color: var(--red); border-color: rgba(255, 138, 138, .45); }
.btn:focus-visible, .row:focus-visible, .chip:focus-visible, .track:focus-visible, .tick:focus-visible, .targetbtn:focus-visible, select:focus-visible, textarea:focus-visible, .pill:focus-visible, a:focus-visible, .seg button:focus-visible, .prow:focus-visible, .pitem:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.field { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; border: 1px solid var(--line-2); border-radius: 6px; background: #05070D; transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(143, 184, 255, .14); }
.field .prompt { font-family: var(--mono); color: var(--gold); }
.field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-family: var(--mono); font-size: 13px; }
.field input::placeholder { color: var(--faint); }
.err { font-size: 13px; color: var(--red); }
.note { font-size: 12.5px; color: var(--faint); }
select { height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raised); padding: 0 6px; font-size: 13px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); }
button.chip { cursor: pointer; transition: color .15s, border-color .15s; }
button.chip:hover { color: var(--ink); border-color: var(--line-2); }
/* Status dot. --bc is the skill's branch colour, set inline by the row that owns it. */
.st { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; flex: none; }
.st[data-s="active"] { border-color: var(--bc, var(--ice)); }
.st[data-s="active"]::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--bc, var(--ice)); }
.st[data-s="verified"] { border-color: var(--bc, var(--ice)); background: var(--bc, var(--ice)); color: #070A12; box-shadow: 0 0 8px -1px var(--bc, var(--ice)); }

/* ---------- chrome (hidden until a tree is on screen) ---------- */
.hud { transition: opacity .5s var(--ease), transform .5s var(--ease); }
[data-phase="input"] .hud, [data-phase="generating"] .hud { opacity: 0; pointer-events: none; }
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 var(--gr) 0 var(--gl); background: rgba(6, 8, 16, .86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); z-index: 3; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.brand svg { color: var(--gold); flex: none; }
.targetbtn { display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; max-width: 400px; transition: border-color .15s; }
button.targetbtn:hover { border-color: var(--line-2); }
.targetbtn .trk { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); flex: none; }
.targetbtn .txt { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.topbar .btn, .topbar .seg, .lvl, .count { flex: none; }
.lvl { display: flex; align-items: center; gap: 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lvl .lv { font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; color: var(--gold); border: 1px solid rgba(246, 196, 83, .45); background: var(--accent-soft); border-radius: 5px; padding: 2px 7px; }
.lvl .xp { font-size: 12px; color: var(--muted); }
.bar { width: 84px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #C99A2E, var(--gold)); border-radius: 3px; transition: width .7s var(--ease); }
.count { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 500; }
.seg { display: flex; padding: 2px; gap: 2px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line-2); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: #25304E; color: var(--ink); }
kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; background: var(--bg); }

.rail { position: absolute; top: 64px; left: var(--gl); bottom: 12px; width: 272px; z-index: 4; display: flex; flex-direction: column; overflow: hidden; transition: transform .4s var(--ease), opacity .25s, visibility 0s; }
.rail[data-open="false"] { transform: translateX(calc(-100% - 40px)); opacity: 0; visibility: hidden; transition: transform .4s var(--ease), opacity .25s, visibility 0s .4s; }
[data-phase="input"] .rail, [data-phase="generating"] .rail { opacity: 0; pointer-events: none; }
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
.rail-scroll > * { flex: none; }
.next { border: 1px solid rgba(246, 196, 83, .34); background: var(--accent-soft); border-radius: 7px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.next h3 { font-family: var(--display); font-size: 16px; font-weight: 600; line-height: 1.25; }
.next .why { font-family: var(--display); color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.big { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
.pace { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }
.row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; font-size: 13px; transition: background .12s, opacity .15s; }
.row:hover, .row[data-hot="true"] { background: var(--raised); }
.row[data-sel="true"] { background: #1A2440; }
.row[data-dim="true"] { opacity: .4; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .hrs { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.row[data-s="locked"] .name { color: var(--muted); }
.branches { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.branches span { display: flex; align-items: center; gap: 8px; }
.branches i { width: 18px; height: 3px; border-radius: 2px; background: var(--bc); box-shadow: 0 0 8px -1px var(--bc); flex: none; }
.rail-foot { border-top: 1px solid var(--line); padding: 8px 10px 8px 14px; min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.controls { position: absolute; right: var(--gr); bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 8px; background: rgba(11, 15, 26, .92); border: 1px solid var(--line-2); transition: right .45s var(--ease), opacity .5s; }
.controls .btn { border-color: transparent; background: transparent; color: var(--muted); }
.controls .btn:hover { background: var(--raised); color: var(--ink); }
.legend { display: flex; gap: 12px; padding: 0 12px 0 8px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); margin-right: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.pill { position: absolute; left: var(--gl); bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; max-width: calc(100% - var(--gl) - var(--gr) - 170px); border-radius: 8px; background: rgba(11, 15, 26, .92); border: 1px solid rgba(246, 196, 83, .4); cursor: pointer; font-size: 13px; }
.pill .k { font-family: var(--display); color: var(--gold); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; flex: none; }
.pill .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pill svg { flex: none; color: var(--muted); }
.toast { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 9; padding: 10px 16px; border-radius: 6px; background: rgba(9, 12, 22, .97); border: 1px solid rgba(246, 196, 83, .55); color: var(--ink); font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .03em; box-shadow: 0 10px 34px rgba(0, 0, 0, .6), 0 0 24px rgba(246, 196, 83, .16); animation: rise .25s var(--ease) both; max-width: calc(100% - 32px); text-align: center; }
@keyframes rise { from { opacity: 0; translate: 0 -6px; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- node tooltip ---------- */
.tip { position: absolute; z-index: 7; width: 268px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; background: rgba(8, 11, 20, .97); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 14px 40px rgba(0, 0, 0, .65); animation: fade .12s both; }
.tip::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; background: var(--bc, var(--ice)); box-shadow: 0 0 10px var(--bc, var(--ice)); }
.tip .ty { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--bc, var(--ice)); }
.tip .tt { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.tip .ds { font-size: 13px; color: #C4CCE0; }
.tip .rq { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.tip .rq span { display: flex; gap: 7px; align-items: center; color: var(--muted); }
.tip .rq .no { color: var(--red); }
.tip .ft { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 7px; }
.tip .ft b { color: var(--gold); font-weight: 500; }

/* ---------- target screen (state 0 and 1) ---------- */
.termwrap { position: absolute; inset: 0; display: flex; padding: 16px var(--gr) 16px var(--gl); z-index: 6; overflow-y: auto; transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s; }
[data-phase="matrix"] .termwrap { opacity: 0; transform: scale(.97); pointer-events: none; visibility: hidden; transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s; }
.term { margin: auto; width: min(640px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.term h1 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4.4vw, 32px); line-height: 1.12; text-wrap: balance; }
.term .lede { color: var(--muted); font-size: 15px; max-width: 54ch; }
.term .field { height: 50px; }
.term .field input { font-size: 14px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.track { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised); text-align: left; cursor: pointer; transition: border-color .15s, background .15s; min-width: 0; }
.track:hover { border-color: var(--line-2); }
.track[aria-checked="true"] { border-color: var(--gold); background: var(--accent-soft); }
.track .tn { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.track .tn em { font-style: normal; color: var(--gold); }
.track .tc { font-family: var(--display); font-size: 15px; font-weight: 600; line-height: 1.25; }
.track .tm { font-size: 12px; color: var(--faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
.track .tm.has { color: var(--gold); }
.term-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.term-foot .note { flex: 1 1 200px; }
.term-foot .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.log { font-family: var(--mono); font-size: 12.5px; display: flex; flex-direction: column; gap: 10px; min-height: 132px; }
.log div { display: grid; grid-template-columns: 16px 64px 1fr; gap: 8px; animation: rise .25s var(--ease) both; }
.log .ok { color: var(--gold); } .log .k { color: var(--faint); } .log .v { overflow-wrap: anywhere; min-width: 0; }
.log .run { color: var(--focus); animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- inspect panel (states 2 and 3) ---------- */
.panel { position: absolute; top: 64px; bottom: 12px; right: var(--gr); width: min(420px, calc(100% - var(--gl) - var(--gr))); z-index: 5; display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 40px)); opacity: 0; visibility: hidden; transition: transform .45s var(--ease), opacity .3s, visibility 0s .45s; }
.panel[data-open="true"] { transform: none; opacity: 1; visibility: visible; transition: transform .45s var(--ease), opacity .3s, visibility 0s; }
.qp-head { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.qp-top { display: flex; align-items: center; gap: 10px; }
.qp-top .code { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--bc, var(--faint)); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 5px; background: var(--raised); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.badge[data-s="active"] { background: rgba(143, 184, 255, .12); color: var(--focus); }
.badge[data-s="verified"] { background: var(--accent-soft); color: var(--gold); }
.badge.gold { background: var(--accent-soft); color: var(--gold); }
.qp-head h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.qp-head p { color: var(--muted); }
.qp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.qp-body > * { flex: none; }
.quest { display: flex; flex-direction: column; gap: 8px; }
.quest h3 { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; text-wrap: balance; }
.quest p { color: #C4CCE0; max-width: 60ch; }
.boss-tag { color: var(--gold); }
.meta { display: flex; gap: 24px; flex-wrap: wrap; }
.meta div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meta b { font-weight: 500; font-size: 13.5px; }
.meta b.xp { color: var(--gold); }
.accept { display: flex; flex-direction: column; gap: 2px; margin: 6px -6px 0; }
.tick { display: grid; grid-template-columns: 18px 1fr; gap: 10px; width: 100%; padding: 6px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 13.5px; color: #C4CCE0; cursor: pointer; }
.tick:hover { background: var(--raised); }
.tick[aria-disabled="true"] { cursor: default; }
.tick[aria-disabled="true"]:hover { background: transparent; }
.box { width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--line-2); border-radius: 50%; display: grid; place-items: center; color: transparent; transition: all .15s; }
.tick[aria-checked="true"] .box { border-color: var(--bc, var(--ice)); background: var(--bc, var(--ice)); color: #070A12; box-shadow: 0 0 8px -1px var(--bc, var(--ice)); }
.lineage { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.redact { filter: blur(6px); opacity: .5; user-select: none; pointer-events: none; }
.qp-foot { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; background: #080B14; }
.qp-foot .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn.primary { flex: 1; }
.vlog { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 7px; }
.vlog div { display: grid; grid-template-columns: 16px 52px 1fr; gap: 8px; animation: rise .2s var(--ease) both; }
.vlog .k { color: var(--faint); } .vlog .v { overflow-wrap: anywhere; min-width: 0; }
.vlog .ok { color: var(--gold); } .vlog .run { color: var(--focus); animation: blink .7s steps(2) infinite; } .vlog .warn { color: #FFB86B; }
.proof { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
.proof dt { color: var(--faint); } .proof dd { overflow-wrap: anywhere; min-width: 0; }
.proof dd.mono { font-size: 12.5px; }
.lockmsg { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); }

/* ---------- dialogs ---------- */

  const near = ids => ids.map(x => G.byId[x]).sort((a, b) => Math.abs(a.lane - n.lane) - Math.abs(b.lane - n.lane))[0];
  if (mode === 'path' && (key === 'ArrowUp' || key === 'ArrowDown')) { const o = G.nodes[G.nodes.indexOf(n) + (key === 'ArrowDown' ? 1 : -1)]; return o ? o.id : null; }
  if (key === 'ArrowRight') return n.children.length ? near(n.children).id : null;
  if (key === 'ArrowLeft') return n.deps.length ? near(n.deps).id : null;
  const tier = G.nodes.filter(x => x.depth === n.depth).sort((a, b) => a.lane - b.lane), o = tier[tier.indexOf(n) + (key === 'ArrowDown' ? 1 : -1)];
  return o ? o.id : null;
}

function App() {
  const [st, dispatch] = useReducer(reducer, null, boot);
  const api = useRef(null), rootRef = useRef(null);
  const phone = useMedia('(max-width: 719px)'), wide = useMedia('(min-width: 1180px)');
  const readOnly = !!st.shared, own = st.progress[st.track];
  const view = st.shared || own, G = GRAPHS[st.shared ? st.shared.track : st.track];
  const statusOf = useCallback(id => statusFor(G, view.verified, id), [G, view.verified]);
  const plan = useMemo(() => planFor(G, view.verified, view.checks), [G, view.verified, view.checks]);
  const [tip, setTip] = useState(null), [rootW, setRootW] = useState(1200);
  const live = st.phase === 'matrix', open = !!st.selected && live, railOpen = live && (wide || st.drawer);
  const pathMode = st.viewMode === 'path', graphLive = live && !pathMode;
  const [rootH, setRootH] = useState(800);
  useEffect(() => { const f = () => { setRootH(rootRef.current.clientHeight); setRootW(rootRef.current.clientWidth); }; f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  const insets = phone ? { l: 0, r: 0, t: 56, b: open ? Math.round(rootH * 0.72) : 60 } : { l: wide ? 288 : 0, r: open ? 436 : 0, t: 56, b: 8 };

  // Saved progress: everything the user would not want to lose on reload.
  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, phase: st.home, targetText: st.targetText, track: st.track, progress: st.progress, pace: st.pace, name: st.name, viewMode: st.viewMode, sound: st.sound })); } catch (e) {}
  }, [st.home, st.targetText, st.track, st.progress, st.pace, st.name, st.viewMode, st.sound]);
  useEffect(() => { if (!st.toast) return; const id = setTimeout(() => dispatch({ type: 'TOAST', text: '' }), 3200); return () => clearTimeout(id); }, [st.toast]);
  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === 'k' || e.key === 'K')) { if (!live) return; e.preventDefault(); dispatch({ type: 'DIALOG', dialog: st.dialog === 'palette' ? null : 'palette' }); return; }
      if (e.key === 'Escape') { if (st.dialog) dispatch({ type: 'DIALOG', dialog: null }); else if (st.selected) dispatch({ type: 'SELECT', id: null }); else if (st.drawer) dispatch({ type: 'DRAWER', open: false }); return; }
      if (!live || st.dialog || e.metaKey || e.ctrlKey || e.altKey || !/^Arrow/.test(e.key)) return;
      const el = document.activeElement, tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.closest && el.closest('.qp-body'))) return;
      const to = st.selected ? neighbour(G, st.selected, e.key, st.viewMode) : (plan.next || G.nodes[0]).id;
      e.preventDefault(); if (to) dispatch({ type: 'SELECT', id: to });
    };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  }, [st.dialog, st.selected, st.drawer, st.viewMode, live, G, plan]);
  useEffect(() => {
    const onHash = () => { const sh = readShare(location.hash); if (sh) dispatch({ type: 'SHARED', shared: sh }); else if (sh === undefined) { clearHash(); dispatch({ type: 'TOAST', text: 'That share link is damaged, so it could not be opened.' }); } };
    window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { if (!st.shared && /^#share=/.test(location.hash)) clearHash(); }, [st.shared]);

  const onSelect = useCallback(id => { setTip(null); dispatch({ type: 'SELECT', id }); }, []);
  const onHover = useCallback((id, info) => { dispatch({ type: 'HOVER', id }); setTip(id && info ? { id, x: info.x, y: info.y, r: info.r, pip: info.pip } : null); }, []);
  const onPip = (id, i) => { if (!readOnly && statusOf(id) === 'active') dispatch({ type: 'CHECK', id, i }); };
  useEffect(() => { setTip(null); }, [st.viewMode, st.phase, st.track, st.dialog, readOnly]);
  // Sound: prime the audio context on the first gesture, then cue unlocks and criteria as the saved state changes.
  useEffect(() => { SFX.set(st.sound); }, [st.sound]);
  useEffect(() => { const f = () => SFX.prime(); window.addEventListener('pointerdown', f); window.addEventListener('keydown', f); return () => { window.removeEventListener('pointerdown', f); window.removeEventListener('keydown', f); }; }, []);
  const heard = useRef(null);
  useEffect(() => {
    const key = G.key + (readOnly ? ':shared' : ''), v = view.verified.length, t = Object.keys(view.checks).reduce((sum, id) => sum + view.checks[id].filter(Boolean).length, 0), was = heard.current;
    if (was && was.key === key && live) {
      if (v === was.v + 1) SFX.play(G.byId[view.verified[v - 1]].boss ? 'keystone' : 'unlock', phone ? 420 : 0);
      else if (t > was.t) SFX.play('tick'); else if (t < was.t && v === was.v) SFX.play('untick');
    }
    heard.current = { key, v, t };
  }, [G, readOnly, view.verified, view.checks]);
  const onVerify = (id, proof) => dispatch({ type: 'VERIFY', id, proof, close: phone });
  const focus = st.hover || st.selected, fnode = focus ? G.byId[focus] : null;


  return h('div', { ref: rootRef, 'data-phase': st.phase, 'data-panel': open, style: { position: 'absolute', inset: 0, overflow: 'clip' } },
    h(MatrixCanvas, { apiRef: api, graph: G, viewKey: G.key + (readOnly ? ':shared' : ''), verified: view.verified, checks: view.checks, hover: st.hover, selected: live ? st.selected : null,
      insets, follow: open, live: graphLive, burstDelay: phone ? 420 : 0, onHover, onSelect, onPip }),
    live && pathMode ? h(PathView, { G, view, plan, readOnly, statusOf, focus, selected: st.selected, insets, onHover, onSelect }) : null,
    h(TopBar, { st, G, view, readOnly, dispatch }),
    h(PlanRail, { st, G, view, readOnly, open: railOpen, plan, statusOf, focus, dispatch, onHover, onSelect }),
    graphLive && !readOnly && plan.next && !railOpen && !open ? h('button', { className: 'pill hud', onClick: () => onSelect(plan.next.id) }, h('span', { className: 'k' }, 'Next'), h('span', { className: 'v' }, plan.next.short + ' · ' + plan.next.hours + ' h'), Icon('arrow')) : null,
    graphLive && tip && !st.dialog && !(tip.pip < 0 && tip.id === st.selected) ? h(Tip, { G, view, tip, readOnly, statusOf, rootW, rootH }) : null,
    pathMode ? null : h('div', { className: 'controls hud' },
      h('div', { className: 'legend' }, [['locked', 'Locked'], ['active', 'Available'], ['verified', 'Unlocked']].map(s => h('span', { key: s[0] }, St(s[0]), s[1]))),
      h('button', { className: 'btn icon', onClick: () => dispatch({ type: 'SOUND', on: !st.sound }), 'aria-pressed': st.sound, 'aria-label': st.sound ? 'Mute sounds' : 'Turn sounds on', title: st.sound ? 'Mute sounds' : 'Turn sounds on' }, Icon(st.sound ? 'sound' : 'mute')),
      h('button', { className: 'btn icon', onClick: () => api.current.zoomBy(1 / 1.35), 'aria-label': 'Zoom out', title: 'Zoom out' }, Icon('minus')),
      h('button', { className: 'btn icon', onClick: () => api.current.zoomBy(1.35), 'aria-label': 'Zoom in', title: 'Zoom in' }, Icon('plus')),
      h('button', { className: 'btn icon', onClick: () => api.current.fit(), 'aria-label': 'Fit tree to view', title: 'Fit to view' }, Icon('fit'))),
    h(QuestPanel, { G, view, node: st.selected ? G.byId[st.selected] : null, open, readOnly, statusOf, dispatch, onClose: () => onSelect(null), onVerify, onJump: onSelect }),
    h(Terminal, { st, dispatch }),
    st.dialog === 'share' && !readOnly ? h(ShareDialog, { st, dispatch }) : null,
    st.dialog === 'palette' && live ? h(Palette, { st, G, readOnly, plan, wide, statusOf, dispatch, api, onSelect }) : null,
    st.toast ? h('div', { className: 'toast', key: st.toast.id, role: 'status' }, st.toast.text) : null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
